name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: System libraries for Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libgomp1 \
            libsm6 libx11-6 libxext6 libxfixes3 libxi6 libxkbcommon0 libxrender1 libxxf86vm1
      - run: pip install -r requirements-dev.txt
      # Includes a real Blender render of PDB 1CRN downloaded from RCSB.
      - run: pytest -v

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t renderthemolecule .
      - name: Container starts and answers
        run: |
          docker run -d --name rtm -p 7860:7860 renderthemolecule
          for i in $(seq 1 30); do curl -fsS localhost:7860/healthz && exit 0; sleep 2; done
          docker logs rtm; exit 1

  # Deploy to Modal (see README, "Deploy on Modal"). Runs when started by hand
  # (Actions → CI → Run workflow) or on pushes to main, once the repository
  # variable MODAL_DEPLOY is "true" and secrets MODAL_TOKEN_ID / MODAL_TOKEN_SECRET
  # are set. SHEET_WEBHOOK_URL / SHEET_TOKEN secrets, if set, turn on the Sheet record.
  deploy-modal:
    needs: [tests, docker]
    if: >-
      vars.MODAL_DEPLOY == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install modal==1.6.3
      - name: Deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: modal deploy modal_app.py

  # Optional: deploy to a Hugging Face Space (needs a PRO account) on every push to main.
  # Set repository variable HF_SPACE (e.g. yourname/renderthemolecule) and
  # repository secret HF_TOKEN (a Hugging Face token with write access).
  deploy:
    needs: [tests, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HF_SPACE != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
